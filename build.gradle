plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        moddeck {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def modVersion = version.toString()

processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // Keep the distributable self-contained: users inspecting only the mod jar must still
    // receive this project's MIT terms and the notices for bundled font/icon assets.
    from('LICENSE') {
        rename { 'LICENSE_moddeck' }
    }
    from('THIRD_PARTY_NOTICES.md')

    // Fabric Loom's splitEnvironmentSourceSets() keeps the client source set out of the
    // main feature's apiElements/runtimeElements, so composite-build consumers of the
    // published coordinates only see the common classes. Because ModDeckApi is intentionally
    // client-only, merge the client output into the distributable jar so dependent mods can
    // resolve it through the normal project dependency path without exposing a separate variant.
    // Only include classes that are not already present in the main source set to avoid duplicates.
    from(sourceSets.client.output.classesDirs) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

// Expose the client source set as an additional outgoing variant. Loom's
// splitEnvironmentSourceSets() wires the client source set into compile/runtime classpaths
// internally but does not add it to the java component's consumable variants, so a
// composite-build consumer cannot request it through apiElements/runtimeElements. Adding a
// capability-bearing outgoing configuration lets dependent projects request the client
// classes explicitly without disturbing the main variant or the published Maven artifact.
configurations {
    clientElements {
        canBeConsumed = true
        canBeResolved = false

        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        }

        outgoing {
            capability('com.yoima:moddeck-client-classes:' + version)
            sourceSets.client.output.classesDirs.files.each { dir ->
                artifact(dir) {
                    type = 'java-classes-directory'
                }
            }
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
